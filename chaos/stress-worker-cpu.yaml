apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: worker-cpu-stress
  namespace: kubescale
  labels:
    app.kubernetes.io/part-of: kubescale-ai
    app.kubernetes.io/component: chaos-test
spec:
  mode: all
  selector:
    namespaces:
      - kubescale
    labelSelectors:
      app.kubernetes.io/component: worker
  stressors:
    cpu:
      workers: 2
      load: 85
  duration: "120s"
