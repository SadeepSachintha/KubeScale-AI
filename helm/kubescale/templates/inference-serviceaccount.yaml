{{- if .Values.inference.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.inference.serviceAccount.name }}
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference
  annotations:
    {{- toYaml .Values.inference.serviceAccount.annotations | nindent 4 }}
{{- end }}
