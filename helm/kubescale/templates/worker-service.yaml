{{- if .Values.worker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubescale.worker.fullname" . }}
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: {{ .Values.worker.service.type }}
  ports:
    - name: metrics
      port: {{ .Values.worker.service.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "kubescale.worker.selectorLabels" . | nindent 4 }}
{{- end }}
