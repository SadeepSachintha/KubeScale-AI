{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubescale.fullname" . }}-secrets
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_KEY: {{ .Values.secrets.apiKey | default "kubescale-dev-secret-key" | quote }}
  INTERNAL_TOKEN: {{ .Values.secrets.internalToken | default "kubescale-internal-cluster-auth-token" | quote }}
{{- end }}
