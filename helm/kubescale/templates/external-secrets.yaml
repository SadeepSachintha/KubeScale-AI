{{- if .Values.externalSecrets.enabled }}
{{- if .Values.externalSecrets.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.serviceAccount.name }}
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.externalSecrets.serviceAccount.annotations | nindent 4 }}
---
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "kubescale.fullname" . }}-secretstore
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
spec:
  provider:
    {{- if eq .Values.externalSecrets.provider "aws" }}
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.aws.region | default "us-east-1" }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount.name }}
    {{- else if eq .Values.externalSecrets.provider "vault" }}
    vault:
      server: {{ .Values.externalSecrets.vault.server }}
      path: {{ .Values.externalSecrets.vault.path }}
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: {{ .Values.externalSecrets.vault.role }}
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount.name }}
    {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "kubescale.fullname" . }}-externalsecret
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ include "kubescale.fullname" . }}-secretstore
    kind: SecretStore
  target:
    name: {{ include "kubescale.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretKey | quote }}
        property: API_KEY
    - secretKey: INTERNAL_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretKey | quote }}
        property: INTERNAL_TOKEN
{{- end }}
