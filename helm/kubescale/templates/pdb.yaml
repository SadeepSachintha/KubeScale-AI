{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kubescale.gateway.fullname" . }}-pdb
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "kubescale.gateway.selectorLabels" . | nindent 6 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kubescale.inference.fullname" . }}-pdb
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
---
{{- if .Values.worker.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kubescale.worker.fullname" . }}-pdb
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "kubescale.worker.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}

