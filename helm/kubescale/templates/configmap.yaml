apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubescale.fullname" . }}-config
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  LOG_LEVEL: {{ .Values.gateway.env.LOG_LEVEL | default "INFO" | quote }}
  TRITON_GRPC_URL: "{{ include "kubescale.inference.fullname" . }}:{{ .Values.inference.service.grpcPort }}"
  TRITON_HTTP_URL: "{{ include "kubescale.inference.fullname" . }}:{{ .Values.inference.service.httpPort }}"
  TRITON_TIMEOUT_SECONDS: {{ .Values.gateway.env.TRITON_TIMEOUT_SECONDS | default "5.0" | quote }}
  KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.kafka.clusterName }}-kafka-bootstrap:9092"
  KAFKA_ENABLED: {{ .Values.gateway.env.KAFKA_ENABLED | default "true" | quote }}
  KAFKA_INFERENCE_REQUESTS_TOPIC: "inference-requests"
  KAFKA_INFERENCE_RESULTS_TOPIC: "inference-results"
