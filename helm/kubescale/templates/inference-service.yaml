apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubescale.inference.fullname" . }}
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
    app.kubernetes.io/component: inference
spec:
  type: {{ .Values.inference.service.type }}
  ports:
    - name: http
      port: {{ .Values.inference.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.inference.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: {{ .Values.inference.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "kubescale.inference.selectorLabels" . | nindent 4 }}
