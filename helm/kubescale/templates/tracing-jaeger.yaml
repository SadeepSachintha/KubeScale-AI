{{- if and .Values.tracing.enabled .Values.tracing.jaeger.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubescale.fullname" . }}-jaeger
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kubescale.name" . }}-jaeger
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "kubescale.name" . }}-jaeger
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "kubescale.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jaeger
          image: "{{ .Values.tracing.jaeger.image.repository }}:{{ .Values.tracing.jaeger.image.tag }}"
          imagePullPolicy: {{ .Values.tracing.jaeger.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: COLLECTOR_OTLP_GRPC_HOST_PORT
              value: "0.0.0.0:4317"
            - name: COLLECTOR_OTLP_HTTP_HOST_PORT
              value: "0.0.0.0:4318"
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.tracing.jaeger.service.otlpGrpcPort }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.tracing.jaeger.service.otlpHttpPort }}
              protocol: TCP
            - name: ui
              containerPort: {{ .Values.tracing.jaeger.service.uiPort }}
              protocol: TCP
          resources:
            {{- toYaml .Values.tracing.jaeger.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kubescale.fullname" . }}-jaeger
  labels:
    {{- include "kubescale.labels" . | nindent 4 }}
    app.kubernetes.io/component: tracing
spec:
  type: {{ .Values.tracing.jaeger.service.type }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.tracing.jaeger.service.otlpGrpcPort }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.tracing.jaeger.service.otlpHttpPort }}
      targetPort: otlp-http
      protocol: TCP
    - name: ui
      port: {{ .Values.tracing.jaeger.service.uiPort }}
      targetPort: ui
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "kubescale.name" . }}-jaeger
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
