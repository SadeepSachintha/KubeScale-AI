# ==============================================================================
# Production Configuration Overrides for KubeScale AI Helm Chart
# Applied via: helm upgrade --install kubescale ./helm/kubescale -f ./helm/kubescale/values-prod.yaml
# ==============================================================================

environment: prod

# ------------------------------------------------------------------------------
# API Gateway Production Settings
# ------------------------------------------------------------------------------
gateway:
  replicaCount: 3
  image:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/kubescale/gateway
    tag: v1.0.0
    pullPolicy: IfNotPresent

  env:
    LOG_LEVEL: "WARNING"
    TRITON_TIMEOUT_SECONDS: "3.0"
    KAFKA_ENABLED: "true"

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75

# ------------------------------------------------------------------------------
# Asynchronous Kafka Consumer Worker (Production Settings)
# ------------------------------------------------------------------------------
worker:
  enabled: true
  replicaCount: 3
  image:
    repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/kubescale/worker
    tag: v1.0.0
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# ------------------------------------------------------------------------------
# Triton Inference Server Production Settings
# ------------------------------------------------------------------------------
inference:
  replicaCount: 3
  image:
    repository: nvcr.io/nvidia/tritonserver
    tag: 24.05-py3
    pullPolicy: IfNotPresent

  command:
    - "tritonserver"
    - "--model-repository=s3://kubescale-ai-model-repository"
    - "--strict-model-config=true"
    - "--exit-on-error=true"
    - "--log-verbose=0"

  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
    limits:
      cpu: 8000m
      memory: 16Gi

  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  serviceAccount:
    create: true
    name: kubescale-inference-sa
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/kubescale-inference-s3-irsa-role

  modelStorage:
    type: s3
    s3Bucket: "s3://kubescale-ai-model-repository"

# ------------------------------------------------------------------------------
# Kafka Enterprise Production Cluster
# ------------------------------------------------------------------------------
kafka:
  enabled: true
  replicas: 3
  storage:
    type: persistent-claim
    size: 100Gi
    class: gp3
    deleteClaim: false
  zookeeper:
    replicas: 3
    storage:
      type: persistent-claim
      size: 20Gi
      class: gp3
      deleteClaim: false
  topics:
    - name: inference-requests
      partitions: 12
      replicas: 3
    - name: inference-results
      partitions: 12
      replicas: 3

# ------------------------------------------------------------------------------
# Ingress Controller Routing & TLS Termination (Production)
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "128m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/limit-rps: "100"
  hosts:
    - host: api.kubescale.ai
      paths:
        - path: /
          pathType: Prefix
          service: gateway
  tls:
    - secretName: kubescale-api-tls
      hosts:
        - api.kubescale.ai

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# ------------------------------------------------------------------------------
# Event-Driven Autoscaling with KEDA (Production Settings)
# ------------------------------------------------------------------------------
keda:
  enabled: true
  worker:
    enabled: true
    minReplicaCount: 2
    maxReplicaCount: 20
    lagThreshold: "100"
    pollingInterval: 10
    cooldownPeriod: 300
    consumerGroup: "kubescale-inference-workers"
  inference:
    enabled: true
    minReplicaCount: 3
    maxReplicaCount: 15
    pollingInterval: 10
    cooldownPeriod: 300
    prometheusServerAddress: "http://prometheus-k8s.monitoring.svc:9090"
    queueThresholdUs: "10000"

# ------------------------------------------------------------------------------
# Observability: Prometheus ServiceMonitors & Alerting Rules (Production)
# ------------------------------------------------------------------------------
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: "10s"
    scrapeTimeout: "5s"
  prometheusRules:
    enabled: true

# ------------------------------------------------------------------------------
# External Secrets Operator (Production: AWS Secrets Manager with IRSA)
# ------------------------------------------------------------------------------
externalSecrets:
  enabled: true
  provider: "aws"
  refreshInterval: "30m"
  remoteSecretKey: "kubescale/production/credentials"
  aws:
    region: "us-east-1"
  serviceAccount:
    create: true
    name: "kubescale-eso-sa"
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/kubescale-eso-irsa-role"



