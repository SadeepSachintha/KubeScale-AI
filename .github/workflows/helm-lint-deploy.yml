name: Helm Lint, Test & Container CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'helm/**'
      - 'gateway/**'
      - 'worker/**'
      - '.github/workflows/helm-lint-deploy.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'helm/**'
      - 'gateway/**'
      - 'worker/**'
      - '.github/workflows/helm-lint-deploy.yml'

jobs:
  helm-validation:
    name: Helm Lint & Template Dry-Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.2

      - name: Lint Helm Chart (Dev Values)
        run: helm lint helm/kubescale

      - name: Lint Helm Chart (Prod Values)
        run: helm lint helm/kubescale -f helm/kubescale/values-prod.yaml

      - name: Render Helm Template (Validation)
        run: |
          helm template test-release helm/kubescale \
            --values helm/kubescale/values.yaml > /dev/null
          echo "Helm dev template rendered successfully."
          helm template test-release-prod helm/kubescale \
            --values helm/kubescale/values-prod.yaml > /dev/null
          echo "Helm prod template rendered successfully."

  unit-tests:
    name: Python Unit & Integration Tests (Gateway & Worker)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements.txt
          pip install -r worker/requirements.txt

      - name: Run Pytest Suite
        run: pytest -v

  docker-build-gateway:
    name: Build & Validate Gateway Container
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          file: ./gateway/Dockerfile
          push: false
          tags: kubescale/gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-worker:
    name: Build & Validate Worker Container
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: false
          tags: kubescale/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
