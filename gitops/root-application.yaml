apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubescale-root
  namespace: argocd
  labels:
    app.kubernetes.io/name: kubescale-root
    environment: management
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SadeepSachintha/KubeScale-AI.git
    targetRevision: HEAD
    path: gitops/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
