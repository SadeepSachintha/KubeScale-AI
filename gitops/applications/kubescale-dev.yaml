apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubescale-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: kubescale
    environment: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SadeepSachintha/KubeScale-AI.git
    targetRevision: HEAD
    path: helm/kubescale
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kubescale-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
