apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: Disallow HostPath Volumes
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      HostPath volumes expose underlying node filesystems to containers, presenting a severe security escape risk.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-host-path
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - "kubescale*"
      validate:
        message: "HostPath volumes are disallowed. Use PersistentVolumeClaims or ConfigMaps."
        pattern:
          spec:
            =(volumes):
              - X(hostPath): "null"
