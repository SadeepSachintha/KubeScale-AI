apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
  annotations:
    policies.kyverno.io/title: Disallow Root User
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must run as non-root to prevent container breakout and host compromise.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - "kubescale*"
      validate:
        message: "Running as root is prohibited. Set securityContext.runAsNonRoot: true and runAsUser >= 10000."
        pattern:
          spec:
            =(securityContext):
              runAsNonRoot: true
              =(runAsUser): ">9999"
            containers:
              - =(securityContext):
                  =(runAsNonRoot): true
                  =(runAsUser): ">9999"
